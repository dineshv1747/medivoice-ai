# MediVoice AI - Spring Boot Configuration

# Server
server.port=8080
spring.application.name=medivoice-ai

# AWS Configuration (loaded from environment variables)
aws.access-key-id=${AWS_ACCESS_KEY_ID:AKIAUIVCTHY6VJTUWVG3}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:REPLACE_WITH_YOUR_SECRET_KEY}
aws.region=${AWS_REGION:us-east-1}

# S3cmd
s3.bucket.name=${S3_BUCKET_NAME:medivoice-uploads-dinesh}

# File upload limits (50MB for audio/images)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.medivoice=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.dev.langchain4j=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
